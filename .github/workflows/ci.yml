name: CI (Validate Metadata)

on:
  pull_request:
  push:
    branches: ["main"]
  repository_dispatch:
    types: [data-repo-update]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      HAS_DATA_TOKEN: ${{ secrets.DATA_REPO_TOKEN != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Checkout catalog data
        if: env.HAS_DATA_TOKEN == 'true'
        uses: actions/checkout@v5
        with:
          repository: ruoxinx/open-construction-data
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: _catalog-data

      - name: Copy catalog data into site/data
        if: env.HAS_DATA_TOKEN == 'true'
        run: cp _catalog-data/*.json site/data/

      - name: Copy images into site/assets/img
        if: env.HAS_DATA_TOKEN == 'true'
        run: |
          if [ -d _catalog-data/img ]; then
            rsync -a --exclude='Rebar-Counting.mp4' --exclude='Buildee.gif' _catalog-data/img/. site/assets/img/
          fi

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jsonschema requests

      - name: Validate JSON against schemas
        run: |
          mkdir -p reports
          python scripts/validate.py --report reports/validate.json

      - name: Check links (sampled for speed)
        run: |
          python scripts/check_links.py --report reports/links.json --max-urls 250 --fail-threshold 1

      - name: Validate site structure
        run: |
          node site/scripts/validate-site-structure.mjs

      - name: Generate sitemap
        run: |
          node site/scripts/generate-sitemap.mjs

      - name: Create Markdown CI summary
        run: |
          python scripts/format_validate_report.py \
            --validate reports/validate.json \
            --links reports/links.json \
            --out reports/summary.md

      - name: Upload CI report
        uses: actions/upload-artifact@v6
        with:
          name: ci-report
          path: reports/summary.md
