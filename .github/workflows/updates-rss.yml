name: Build updates.xml (RSS)

permissions:
  contents: write  # allow pushing commits

concurrency:
  group: updates-rss-main
  cancel-in-progress: false

on:
  push:
    branches: [main]
    paths:
      - site/data/generate-updates.js
      - .github/workflows/updates-rss.yml
  repository_dispatch:
    types: [data-repo-update]
  schedule:
    - cron: '0 2 * * *'   # daily at 02:00 UTC
  workflow_dispatch:


jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Checkout catalog data
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: ruoxinx/open-construction-data
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: _catalog-data
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*.json

      - name: Copy catalog data into site/data
        run: cp _catalog-data/*.json site/data/

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24

      - name: Rebuild and publish updates.xml
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "OpenConstruction Bot"
          git config user.email "support@openconstruction.org"

          for attempt in 1 2 3; do
            # Start every attempt from the latest main, including force-updates.
            git fetch origin +main:refs/remotes/origin/main
            git checkout -B main refs/remotes/origin/main

            node site/data/generate-updates.js

            if git diff --quiet -- updates.xml; then
              echo "updates.xml is already current."
              exit 0
            fi

            git add -- updates.xml
            git commit -m "chore: update RSS feed"

            if git push origin HEAD:main; then
              echo "Published updates.xml on attempt ${attempt}."
              exit 0
            fi

            echo "main advanced during attempt ${attempt}; retrying from origin/main."
          done

          echo "Could not publish updates.xml after three attempts." >&2
          exit 1

