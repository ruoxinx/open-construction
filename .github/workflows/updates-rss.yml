name: Build updates.xml (RSS)

permissions:
  contents: write  # allow pushing commits

on:
  push:
    paths:
      - site/data/generate-updates.js
      - .github/workflows/updates-rss.yml
  repository_dispatch:
    types: [data-repo-update]
  schedule:
    - cron: '0 2 * * *'   # daily at 02:00 UTC
  workflow_dispatch:


jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout catalog data
        uses: actions/checkout@v4
        with:
          repository: ruoxinx/open-construction-data
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: _catalog-data

      - name: Copy catalog data into site/data
        run: cp _catalog-data/*.json site/data/

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: node site/data/generate-updates.js

      - name: Commit updates.xml
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update RSS feed"
          file_pattern: "updates.xml"
          
          commit_user_name: "OpenConstruction Bot"
          commit_user_email: "support@openconstruction.org"
          commit_author: "OpenConstruction Bot <support@openconstruction.org>"

