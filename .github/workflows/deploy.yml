name: Deploy site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  repository_dispatch:
    types: [data-repo-update]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Checkout catalog data
        uses: actions/checkout@v5
        with:
          repository: ruoxinx/open-construction-data
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: _catalog-data

      - name: Copy catalog data into site/data
        run: cp _catalog-data/*.json site/data/

      - name: Debug private repo structure
        run: ls -la _catalog-data/ && ls -la _catalog-data/img/ 2>/dev/null || echo "No img/ folder found"

      - name: Copy images into site/assets/img
        run: |
          if [ -d _catalog-data/img ]; then
            cp -r _catalog-data/img/. site/assets/img/
          else
            echo "WARNING: No img/ folder in private repo"
          fi

      # If your site is pure static HTML/CSS/JS, no build step is needed.
      # If you later add a build step, put it here and output to ./site (or ./dist).

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Generate sitemap
        run: |
          node site/scripts/generate-sitemap.mjs

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages
          path: ./site
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages
