name: Deploy site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  repository_dispatch:
    types: [data-repo-update]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Checkout catalog data
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: ruoxinx/open-construction-data
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: _catalog-data
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*.json
            /img/
            !/img/Rebar-Counting.mp4
            !/img/Buildee.gif

      - name: Copy catalog data into site/data
        run: cp _catalog-data/*.json site/data/

      - name: Debug private repo structure
        run: ls -la _catalog-data/ && ls -la _catalog-data/img/ 2>/dev/null || echo "No img/ folder found"

      - name: Copy images into site/assets/img
        run: |
          if [ -d _catalog-data/img ]; then
            rsync -a --exclude='Rebar-Counting.mp4' --exclude='Buildee.gif' _catalog-data/img/. site/assets/img/
          else
            echo "WARNING: No img/ folder in private repo"
          fi

      - name: Validate catalog JSON
        run: |
          node -e '
            const fs = require("fs");
            for (const file of fs.readdirSync("site/data").filter(name => name.endsWith(".json"))) {
              const path = `site/data/${file}`;
              console.log(`validating ${file}`);
              try {
                JSON.parse(fs.readFileSync(path, "utf8"));
              } catch (error) {
                console.error(`Invalid JSON in ${path}: ${error.message}`);
                process.exit(1);
              }
              console.log(`validated ${file}`);
            }
          '

      - name: Validate security sources
        run: |
          node site/scripts/validate-security-sources.mjs

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Generate sitemap
        run: |
          node site/scripts/generate-sitemap.mjs

      - name: Archive Pages artifact
        run: |
          tar \
            --directory ./site \
            -cvf "$RUNNER_TEMP/artifact.tar" \
            --exclude=.git \
            --exclude=.github \
            --exclude='.[^/]*' \
            .

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 7
          if-no-files-found: error
          overwrite: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: github-pages
