<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Signing in · OpenConstruction</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="../assets/css/shared-site.css" rel="stylesheet">
</head>
<body>
<main class="container oc-container py-5">
	  <div class="oc-auth-card mx-auto" style="max-width:520px">
	    <h1 class="h4 fw-bold">Finishing sign in</h1>
	    <p id="statusText" class="text-muted mb-0">Connecting your OpenConstruction account...</p>
	    <a id="retryLink" class="btn btn-outline-primary btn-sm mt-3 d-none" href="sign-in.html">Try signing in again</a>
	  </div>
	</main>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="../assets/js/config.js"></script>
<script src="../assets/js/auth.js"></script>
<script>
  (async () => {
    const status = document.getElementById('statusText');
    try {
      await window.OCAuth.handleCallback();
      const target = await window.OCAuth.resolvePostSignInHref(window.OCAuth.takeReturnTo());
      window.location.replace(target);
	    } catch (err) {
	      status.textContent = err.message || 'Sign in could not be completed. Please try again.';
	      status.classList.remove('text-muted');
	      status.classList.add('text-danger');
	      document.getElementById('retryLink')?.classList.remove('d-none');
	    }
	  })();
</script>
</body>
</html>
