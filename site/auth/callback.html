  <title>Signing in · OpenConstruction</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body>
<main class="container oc-container py-5">
	  <div class="oc-auth-card mx-auto" style="max-width:520px">
	    <h1 class="h4 fw-bold">Finishing sign in</h1>
	    <p id="statusText" class="text-muted mb-0">Connecting your OpenConstruction account...</p>
	    <a id="retryLink" class="btn btn-outline-primary btn-sm mt-3 d-none" href="sign-in.html">Try signing in again</a>
	  </div>
	</main>
<script src="https://unpkg.com/@supabase/supabase-js@2.112.1/dist/umd/supabase.js" integrity="sha384-0x8XPoHt08aHZj+RHs8ojmhZ5IDsTLjPgblgWdriayWriqv9dic3Vkv1K2+UqgZV" crossorigin="anonymous"></script>
<script src="../assets/js/config.js"></script>
<script src="../assets/js/auth.js?v=20260821-ask-role-gate"></script>
<script src="../assets/js/site-shell.js?v=20260830-benchmark-ruler"></script>
<script>
  (async () => {
    const status = document.getElementById('statusText');
    try {
      await window.OCAuth.handleCallback();
      const target = await window.OCAuth.resolvePostSignInHref(window.OCAuth.takeReturnTo());
      window.location.replace(target);
	    } catch (err) {
		      status.textContent = window.OCAuth.authErrorMessage?.(err, 'Sign in could not be completed. Please try again.') || 'Sign in could not be completed. Please try again.';
	      status.classList.remove('text-muted');
	      status.classList.add('text-danger');
	      document.getElementById('retryLink')?.classList.remove('d-none');
	    }
	  })();
</script>
</body>
</html>
