  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/css/shared-site.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg bg-white border-bottom sticky-top oc-nav">
  <div class="container oc-container">
    <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
      <img src="assets/img/icon.png" alt="OpenConstruction logo" class="oc-logo" height="44" width="44">
      <span class="brand-wordmark">
        <span class="oc-open">OpenConstruction</span>
        <span class="oc-construction">Open Science</span>
      </span>
    </a>
    <button class="navbar-toggler ms-2" type="button" data-bs-toggle="collapse" data-bs-target="#navbarsExample" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarsExample">
      <ul class="navbar-nav ms-auto align-items-lg-center gap-2">
        <li class="nav-item"><a class="nav-link plain" href="index.html">Home</a></li>

<main id="mainContent" class="container oc-container py-5">
  <section class="oc-auth-card mx-auto" style="max-width: 760px;" aria-labelledby="verifyTitle">
    <p class="oc-auth-kicker mb-2">Credential verification</p>
    <h1 id="verifyTitle" class="h3 fw-bold mb-3">OpenConstruction credential record</h1>
    <div id="verifyStatus" class="alert alert-secondary" role="status">Checking credential...</div>
    <div id="verifyResult" class="d-none">
      <div class="row g-3">
        <div class="col-md-6">
          <div class="small text-muted fw-semibold text-uppercase">Recipient</div>
          <div id="credentialRecipient" class="fs-5 fw-semibold"></div>
        </div>
        <div class="col-md-6">
          <div class="small text-muted fw-semibold text-uppercase">Credential</div>
          <div id="credentialLabel" class="fs-5 fw-semibold"></div>
        </div>
        <div class="col-md-6">
          <div class="small text-muted fw-semibold text-uppercase">Issued</div>
          <div id="credentialIssued"></div>
        </div>
        <div class="col-md-6">
          <div class="small text-muted fw-semibold text-uppercase">Credential ID</div>
          <code id="credentialCode"></code>
        </div>
      </div>
      <p id="credentialDescription" class="text-muted mt-4 mb-0"></p>
    </div>
  </section>
</main>

<footer class="py-4 mt-3 oc-site-footer">
  <div class="container oc-container small text-muted text-center">
    <div><img src="assets/img/icon.png" alt="OpenConstruction logo" width="24" height="24" style="vertical-align:-5px; margin-right:4px;"> &copy; <span id="yearNow"></span> OpenConstruction Open Science Initiative</div>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="assets/js/config.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const code = (params.get('code') || '').trim();
  const statusEl = document.getElementById('verifyStatus');
  const resultEl = document.getElementById('verifyResult');
  document.getElementById('yearNow').textContent = new Date().getFullYear();

  function setStatus(message, type){
    statusEl.className = `alert alert-${type}`;
    statusEl.textContent = message;
  }

  function formatDate(value){
    if (!value) return '';
    return new Intl.DateTimeFormat('en-US', {
      year: 'numeric',
      month: 'long',
      day: 'numeric'
    }).format(new Date(value));
  }

  async function verify(){
    if (!code) {
      setStatus('No credential ID was provided.', 'warning');
      return;
    }
    if (!window.supabase || !window.SUPABASE_URL || !window.SUPABASE_ANON_KEY) {
      setStatus('Verification is not configured.', 'danger');
      return;
    }
    const endpoint = `${window.SUPABASE_URL.replace(/\/$/, '')}/functions/v1/issue-certificate?code=${encodeURIComponent(code)}&format=json`;
    const response = await fetch(endpoint, {
      headers: {
        Accept: 'application/json'
      }
    });
    const payload = await response.json().catch(() => ({}));
    if (!response.ok && response.status !== 404) {
      setStatus(payload.error || 'The credential could not be verified.', 'danger');
      return;
    }
    const record = payload.record || null;
    if (!record) {
      setStatus('No credential record was found for this ID.', 'warning');
      return;
    }
    const isValid = record.certificate_status === 'valid';
    setStatus(isValid ? 'Verified credential.' : 'This credential has been revoked.', isValid ? 'success' : 'danger');
    document.getElementById('credentialRecipient').textContent =
      record.recipient_name || record.recipient_github || 'OpenConstruction member';
    document.getElementById('credentialLabel').textContent = record.credential_label || 'OpenConstruction credential';
    document.getElementById('credentialIssued').textContent = formatDate(record.issued_at || record.awarded_at);
    document.getElementById('credentialCode').textContent = record.certificate_code || code;
    document.getElementById('credentialDescription').textContent =
      record.credential_description || 'Verified OpenConstruction platform contribution.';
    resultEl.classList.remove('d-none');
  }

  verify();
</script>
</body>
</html>
